<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicVoice - Set Password / First-Time Access</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --page-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --surface: #ffffff;
        --surface-elevated: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-soft: #eff6ff;
        --shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15);
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        --surface: #0f172a;
        --surface-elevated: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: #1e3a8a;
        --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page-bg);
        color: var(--text);
        padding: 24px 16px;
        transition: background 200ms ease, color 200ms ease;
      }

      .card {
        width: min(94vw, 440px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px 36px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        animation: fadeIn 300ms ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card-header {
        text-align: center;
        margin-bottom: 28px;
        position: relative;
      }

      .theme-toggle {
        position: absolute;
        top: -8px;
        right: 0;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 180ms ease;
      }

      .theme-toggle:hover {
        border-color: var(--accent);
      }

      .brand-badge {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--accent);
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 auto 16px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin: 0 0 6px 0;
        letter-spacing: -0.025em;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.92rem;
        margin: 0;
        line-height: 1.4;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--text);
        font-size: 1.025rem;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .phone-input-container {
        display: flex;
        align-items: center;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--text);
        font-size: 1.025rem;
        width: 100%;
      }
      .phone-input-container .phone-prefix {
        padding: 12px 0 12px 16px;
        font-weight: 700;
        color: var(--text);
        font-size: 1.025rem;
        user-select: none;
      }
      .phone-input-container input {
        border: none !important;
        background: transparent !important;
        padding: 12px 16px 12px 8px !important;
        color: var(--text) !important;
        font-size: 1.025rem !important;
        width: 100% !important;
        outline: none !important;
      }

      input:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .primary-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: var(--accent);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 150ms ease, transform 100ms ease;
        margin-top: 8px;
      }

      .primary-btn:hover {
        background: var(--accent-hover);
      }

      .primary-btn:active {
        transform: scale(0.98);
      }

      .primary-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        margin-bottom: 20px;
        line-height: 1.4;
        display: none;
      }

      .alert.error {
        color: #ef4444;
        background: #fef2f2;
        border: 1px solid #fee2e2;
      }

      .alert.success {
        color: #22c55e;
        background: #f0fdf4;
        border: 1px solid #dcfce7;
      }

      body[data-theme="dark"] .alert.error {
        color: #fca5a5;
        background: #450a0a;
        border-color: #7f1d1d;
      }

      body[data-theme="dark"] .alert.success {
        color: #86efac;
        background: #14532d;
        border-color: #166534;
      }

      .footer-links {
        text-align: center;
        margin-top: 24px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .footer-links a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .divider {
        margin: 12px 0;
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <button class="theme-toggle" id="themeToggle">🌙 Dark mode</button>
        <div class="brand-badge">CV</div>
        <h1>Set Password</h1>
        <p class="subtitle" id="subtitleText">Verify your phone number with a WhatsApp verification code to choose a password.</p>
      </div>

      <div class="alert error" id="formError"></div>
      <div class="alert success" id="formSuccess"></div>

      <!-- Step 1 Form: Send OTP -->
      <form id="step1Form">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="phone-input-container">
            <span class="phone-prefix">+91</span>
            <input type="tel" id="phone" placeholder="9876543210" pattern="\d{10}" maxlength="10" required />
          </div>
        </div>
        <button type="submit" class="primary-btn" id="sendOtpBtn">Send Verification Code</button>
      </form>

      <!-- Step 2 Form: Verify OTP and set password -->
      <form id="step2Form" style="display: none;">
        <div class="form-group">
          <label for="otp">Verification Code (from WhatsApp)</label>
          <input type="text" id="otp" placeholder="6-digit code" pattern="\d{6}" maxlength="6" required />
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div style="position: relative;">
            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required style="padding-right: 44px;" />
            <button type="button" class="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center;" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div style="position: relative;">
            <input type="password" id="confirmPassword" placeholder="Repeat password" required style="padding-right: 44px;" />
            <button type="button" class="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center;" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">Verify & Set Password</button>
      </form>

      <!-- Post Success Button -->
      <div id="successActions" style="display: none; text-align: center; margin-top: 12px;">
        <a href="citizen-login.html" class="primary-btn" style="display: block; text-decoration: none; text-align: center;">Go to Login Page</a>
      </div>

      <div class="footer-links">
        <a href="citizen-login.html" id="backToLogin">Back to Sign In</a>
      </div>
    </div>

    <script>
      const step1Form = document.getElementById('step1Form');
      const step2Form = document.getElementById('step2Form');
      const sendOtpBtn = document.getElementById('sendOtpBtn');
      const submitBtn = document.getElementById('submitBtn');
      const successActions = document.getElementById('successActions');
      const backToLogin = document.getElementById('backToLogin');

      const phoneInput = document.getElementById('phone');
      const otpInput = document.getElementById('otp');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      const formError = document.getElementById('formError');
      const formSuccess = document.getElementById('formSuccess');
      const subtitleText = document.getElementById('subtitleText');
      const themeToggle = document.getElementById('themeToggle');

      // Theme toggle functionality
      function applyTheme(theme) {
        document.body.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('civicvoice-theme', theme);
        if (themeToggle) {
          themeToggle.textContent = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
        }
      }

      const savedTheme = localStorage.getItem('civicvoice-theme');
      const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      applyTheme(savedTheme || preferredTheme);

      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(nextTheme);
        });
      }

      // Step 1: Send OTP
      step1Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formError.style.display = 'none';
        formError.textContent = '';
        formSuccess.style.display = 'none';
        formSuccess.textContent = '';
        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent = 'Sending code…';

        const rawPhone = phoneInput.value.trim();
        const phone = rawPhone.startsWith('+') ? rawPhone : '+91' + rawPhone;

        try {
          const res = await fetch('/api/citizen/request-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            throw new Error(data.message || 'Failed to send OTP code. Try again later.');
          }

          formSuccess.textContent = 'Verification code sent to WhatsApp! Check your messages.';
          formSuccess.style.display = 'block';

          // Lock Step 1 and unlock Step 2
          phoneInput.disabled = true;
          sendOtpBtn.style.display = 'none';
          step2Form.style.display = 'block';
          subtitleText.textContent = 'Enter the code received and choose your password.';
          otpInput.focus();
        } catch (err) {
          formError.textContent = err.message;
          formError.style.display = 'block';
          sendOtpBtn.disabled = false;
          sendOtpBtn.textContent = 'Send Verification Code';
        }
      });

      // Step 2: Verify OTP & Set Password
      step2Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formError.style.display = 'none';
        formError.textContent = '';
        formSuccess.style.display = 'none';
        formSuccess.textContent = '';

        const rawPhone = phoneInput.value.trim();
        const phone = rawPhone.startsWith('+') ? rawPhone : '+91' + rawPhone;
        const otp = otpInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword.length < 6) {
          formError.textContent = 'Password must be at least 6 characters.';
          formError.style.display = 'block';
          return;
        }

        if (newPassword !== confirmPassword) {
          formError.textContent = 'Passwords do not match.';
          formError.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving password…';

        try {
          const res = await fetch('/api/citizen/verify-otp-set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, otp, newPassword })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            throw new Error(data.message || 'Failed to verify OTP or set password.');
          }

          formSuccess.textContent = 'Password set successfully! You can now sign in.';
          formSuccess.style.display = 'block';

          // Hide form sections and show action button
          step2Form.style.display = 'none';
          step1Form.style.display = 'none';
          successActions.style.display = 'block';
          backToLogin.style.display = 'none';
          subtitleText.textContent = 'Account setup completed.';
        } catch (err) {
          formError.textContent = err.message;
          formError.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Verify & Set Password';
        }
      });

      const eyeSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      `;
      const eyeOffSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 20px; height: 20px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      `;

      document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', () => {
          const input = button.previousElementSibling;
          if (input.type === 'password') {
            input.type = 'text';
            button.innerHTML = eyeOffSvg;
          } else {
            input.type = 'password';
            button.innerHTML = eyeSvg;
          }
        });
      });
    </script>
  </body>
</html>
